name: CI

# Prod (sanad.eleventures.ai on srvEagle) is deployed by hand from a pinned commit:
# see DEPLOY-srvEagle.md in /opt/sources/sanad on that box. The old Apache/ssh-action
# deploy targeted the pre-2026-07-28 host and never authenticated after 2025-08.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: backend/package-lock.json
    - run: npm ci
    - run: npm test
    - run: npm run build
